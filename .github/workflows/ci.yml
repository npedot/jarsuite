name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: windows-latest,   target: windows-x64 }
          - { os: macos-latest,     target: mac-aarch64 }
          - { os: macos-15-intel,   target: mac-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # the window's native libraries (X11, Wayland, fontconfig) are loaded at run time:
      # building it needs no system packages
      - run: cargo clippy --all-targets --features gui -- -D warnings
      - run: cargo test
      - name: smoke test
        run: cargo run -- --version

  example:
    name: example suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - name: jarexec release named in Cargo.toml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(sed -n 's/^jarexec = .*tag = "\(v[^"]*\)".*/\1/p' Cargo.toml)
          test -n "$tag" || { echo "Cargo.toml must take jarexec from a git tag"; exit 1; }
          gh release download "$tag" --repo npedot/jarexec --pattern "jarexec-$tag-linux-x64.tar.gz" --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP/jarexec-$tag-linux-x64.tar.gz" -C "$RUNNER_TEMP"
          echo "JAREXEC=$RUNNER_TEMP/jarexec-$tag-linux-x64/jarexec" >> "$GITHUB_ENV"
      - run: ./build.sh
        working-directory: examples
      # no JAREXEC here: assemble downloads the jarexec release named in suite-*.toml
      - run: env -u JAREXEC JARSUITE="$GITHUB_WORKSPACE/target/debug/jarsuite" ./e2e.sh
        working-directory: examples

  build:
    name: build (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, example]
    strategy:
      matrix:
        include:
          # 22.04: older glibc → the binaries also run on older distros
          - { os: ubuntu-22.04,     target: linux-x64,     archive: tar.gz }
          - { os: ubuntu-22.04-arm, target: linux-aarch64, archive: tar.gz }
          - { os: windows-latest,   target: windows-x64,   archive: zip }
          - { os: macos-latest,     target: mac-aarch64,   archive: tar.gz }
          - { os: macos-15-intel,   target: mac-x64,       archive: tar.gz }
    runs-on: ${{ matrix.os }}
    env:
      # Windows: static MSVC runtime, no VC++ Redistributable needed on the client
      RUSTFLAGS: ${{ matrix.target == 'windows-x64' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }
      - run: cargo build --release --locked --features gui
      - name: package
        id: package
        shell: bash
        run: |
          name="jarsuite-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=""
          [ "${{ runner.os }}" = Windows ] && exe=.exe
          cp "target/release/jarsuite$exe" "target/release/jarsuite-gui$exe" LICENSE "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            file="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi > "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/${{ steps.package.outputs.file }}*

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
