[package]
name = "jarsuite"
version = "0.1.0"
edition = "2024"
description = "Installs, updates and launches a suite of jarexec applications released together"
license = "MIT"
repository = "https://github.com/npedot/jarsuite"
readme = "README.md"
# `cargo run` starts the CLI; the window is `cargo run --features gui --bin jarsuite-gui`
default-run = "jarsuite"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
# desktop window: the jarsuite-gui binary
gui = ["dep:eframe"]

[[bin]]
name = "jarsuite-gui"
path = "src/bin/jarsuite-gui.rs"
required-features = ["gui"]

[dependencies]

jarexec = { git = "https://github.com/npedot/jarexec", tag = "v0.4.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fd-lock = "4.0.4"
flate2 = "1.1.10"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
tar = "0.4.46"
toml = "1.1.8"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
ctrlc = "3.5.2"
indicatif = "0.18.6"
eframe = { version = "0.37.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
